<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Föräldrapanelen</title>
<meta name="theme-color" content="#14161a" />
<link rel="manifest" href="manifest.json?v=2" />
<link rel="icon" href="icons/icon-192-v2.png" />
<link rel="apple-touch-icon" href="icons/icon-192-v2.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============ LÅSSKÄRM ============ -->
<section id="screen-lock" class="screen active">
  <form id="lock-form" class="lock-card">
    <h1>Föräldrapanelen</h1>
    <p class="muted">Nyckeln är densamma som workrarnas ADMIN_TOKEN. Den sparas bara i den här webbläsaren.</p>
    <input id="key-input" type="password" autocomplete="current-password" placeholder="Nyckel" />
    <button type="submit" class="btn-primary">Lås upp</button>
    <p id="lock-error" class="error" hidden></p>
  </form>
</section>

<!-- ============ PANELEN ============ -->
<section id="screen-panel" class="screen">

  <header class="topbar">
    <div>
      <h1>Föräldrapanelen</h1>
      <p id="updated" class="muted small">Hämtar...</p>
    </div>
    <div class="topbar-actions">
      <button id="refresh-btn" class="btn-ghost" title="Hämta om">Uppdatera</button>
      <button id="lock-btn" class="btn-ghost" title="Glöm nyckeln på den här enheten">Lås</button>
    </div>
  </header>

  <main id="cards" class="cards"></main>

  <section class="composer">
    <h2>Lägg till en uppgift</h2>
    <p class="muted small">Gäller bara den dag du väljer och försvinner sedan av sig själv.</p>
    <input id="extra-text" type="text" maxlength="80" placeholder="Till exempel: Plocka kartong i trädgården" />
    <div class="extra-row">
      <label class="field">
        <span>Emoji</span>
        <input id="extra-emoji" type="text" maxlength="4" value="⭐" />
      </label>
      <label class="field">
        <span>Dag</span>
        <select id="extra-date"></select>
      </label>
      <label class="field">
        <span>Ger</span>
        <select id="extra-gives">
          <option value="both">Mat och kärlek</option>
          <option value="food">Bara mat</option>
          <option value="love">Bara kärlek</option>
        </select>
      </label>
    </div>
    <div id="extra-targets" class="targets"></div>
    <div class="composer-row">
      <button id="extra-btn" class="btn-primary">Lägg till</button>
      <span id="extra-status" class="small"></span>
    </div>
    <div id="extra-list" class="extra-list"></div>
  </section>

  <section class="composer">
    <h2>Skicka ett meddelande</h2>
    <p class="muted small">Landar som en notis på telefonen, direkt.</p>
    <textarea id="message-text" rows="3" maxlength="180" placeholder="Skriv något kort..."></textarea>
    <div id="message-targets" class="targets"></div>
    <div class="composer-row">
      <button id="send-btn" class="btn-primary">Skicka</button>
      <span id="send-status" class="small"></span>
    </div>
  </section>

</section>

<div id="tooltip" class="tooltip" hidden></div>

<script src="app.js"></script>
</body>
</html>
